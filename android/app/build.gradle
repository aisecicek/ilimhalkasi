plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ilimhalkasi.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ilimhalkasi.app'
        minSdk 26
        targetSdk 34
        // Her GitHub derlemesinde sürüm numarası artsın; telefona üstüne kurulabilsin.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
    }

    // Sabit debug anahtarı: her CI derlemesinde imza değişmesin,
    // kullanıcı yeni APK'yı eskisinin üzerine kurabilsin. (Release için ayrı secret kullanılacak.)
    signingConfigs {
        debug {
            storeFile file('ilimhalkasi-debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AndroidX bağımlılıkları farklı Kotlin stdlib sürümleri getiriyor.
// Hepsini aynı sürüme sabitlemek "Duplicate class" hatasını önler.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
