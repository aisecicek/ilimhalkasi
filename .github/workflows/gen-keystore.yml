name: Generate debug keystore (one-off)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate stable debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore ilimhalkasi-debug.keystore \
            -storepass android -keypass android \
            -dname "CN=Ilim Halkasi Debug, OU=Debug, O=Ilim Halkasi, L=Istanbul, ST=TR, C=TR" \
            -noprompt
          keytool -list -v -keystore ilimhalkasi-debug.keystore -storepass android | head -20

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: ilimhalkasi-debug-keystore
          path: ilimhalkasi-debug.keystore
          retention-days: 7
