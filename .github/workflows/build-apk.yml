name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest imajında Android SDK zaten kurulu. Ek setup action'ı
      # gereksiz yere hata verdiği için doğrudan sdkmanager kullanıyoruz.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found (SDK_ROOT=$SDK_ROOT)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Inject server URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          python3 - <<'PY'
          import html, os, pathlib, re
          # Domain yoksa ilk APK ev Wi-Fi'sindeki sunucuya bağlanır.
          # Domain alınınca APP_URL değişkenine https://... adresini yazman yeterli.
          url = (os.environ.get("APP_URL") or "http://192.168.0.107:8765").strip()
          target = pathlib.Path("android/app/src/main/res/values/strings.xml")
          text = target.read_text(encoding="utf-8")
          pattern = r'(<string name="app_host">)[^<]*(</string>)'
          if not re.search(pattern, text):
              raise SystemExit("app_host string not found")
          text = re.sub(pattern, lambda m: m.group(1) + html.escape(url, quote=False) + m.group(2), text)
          target.write_text(text, encoding="utf-8")
          print("APK will connect to:", url)
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ilimhalkasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
